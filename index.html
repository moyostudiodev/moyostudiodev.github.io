<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOYO Studios</title>
<meta name="description" content="MOYO Studios makes small, original games for Android.">
<style>
:root{--ink:#16131f;--panel:#211c2e;--text:#ece7f5;--mute:#a79fbb;--amber:#ffb547;--line:#3a3150}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:48px 16px 64px}
h1{font-size:34px;margin:0;color:var(--amber);letter-spacing:.04em}
.tag{color:var(--mute);margin:4px 0 40px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:0 0 12px}
.game{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.game h3{margin:0 0 4px;font-size:20px}
.game p{margin:0;color:var(--mute)}
footer{margin-top:48px;font-size:14px;color:var(--mute)}
a{color:var(--amber)}
</style>
</head>
<body>
<main>
<h1>MOYO Studios</h1>
<p class="tag">Small, original games for Android.</p>

<h2>Games</h2>
<div class="game">
<h3>Grainfall</h3>
<p>A pixel sandbox with 90+ materials that burn, melt, grow and explode — plus heroes with their own powers.</p>
</div>

<footer>
<a href="privacy.html">Privacy policy / Política de privacidad</a> · <a href="mailto:moyostudio.dev@gmail.com">moyostudio.dev@gmail.com</a>
</footer>
</main>
</body>
</html>
